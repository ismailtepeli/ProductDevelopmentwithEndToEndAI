<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Sitesi Proje Formu · Website Project Questionnaire</title>
<style>
  :root { --ink:#1d2433; --muted:#5b6475; --line:#dde1e8; --bg:#f7f8fa; --card:#fff; --accent:#2f5bea; --req:#c2410c; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2; }
  .bar { max-width:820px; margin:0 auto; padding:14px 20px; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .bar strong { font-size:15px; }
  .bar .progress { color:var(--muted); font-size:14px; }
  main { max-width:820px; margin:0 auto; padding:24px 20px 80px; }
  h1 { font-size:26px; margin:8px 0 6px; }
  .intro { color:var(--muted); margin:0 0 24px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin:0 0 18px; }
  h2 { font-size:18px; margin:0 0 14px; }
  label { display:block; font-weight:600; margin:16px 0 6px; }
  label:first-of-type { margin-top:0; }
  .req { color:var(--req); font-weight:700; margin-left:4px; }
  textarea { width:100%; min-height:72px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; color:inherit; resize:vertical; }
  textarea:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  textarea.missing { border-color:var(--req); }
  button { font:inherit; border-radius:8px; padding:9px 16px; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .note { color:var(--muted); font-size:14px; }
  #msg { color:var(--req); font-size:14px; }
</style>
</head>
<body>
<header><div class="bar">
  <strong id="agency">{{AGENCY_NAME}}</strong>
  <span class="progress" id="progress"></span>
  <div class="actions">
    <button type="button" id="lang">English</button>
    <button type="button" class="primary" id="download"></button>
  </div>
</div></header>
<main>
  <h1 id="title"></h1>
  <p class="intro" id="intro"></p>
  <form id="form"></form>
  <div class="actions"><button type="button" class="primary" id="download2"></button><span id="msg" role="status"></span></div>
  <p class="note" id="privacy"></p>
</main>
<script>
const T = {
  tr: { title:"Web sitesi proje formu", intro:"Bu sorular sitenizi doğru planlamamıza yardımcı olur. * işaretli sorular gerekli; emin olmadıklarınıza \"henüz bilmiyorum\" yazabilirsiniz. Cevaplarınız yalnızca bu tarayıcıda saklanır; bitince \"Cevapları indir\" ile dosyayı bize gönderin.", dl:"Cevapları indir", other:"English", missing:"Lütfen * işaretli soruları doldurun:", progress:(a,b)=>`${a}/${b} gerekli soru`, privacy:"Bu form hiçbir yere veri göndermez. İndirdiğiniz dosyayı e-posta ile iletebilirsiniz." },
  en: { title:"Website project questionnaire", intro:"These questions help us plan your site properly. Questions marked * are required; for anything you are unsure of, write \"not sure yet\". Your answers stay in this browser only; when you finish, use \"Download answers\" and send us the file.", dl:"Download answers", other:"Türkçe", missing:"Please answer the questions marked *:", progress:(a,b)=>`${a}/${b} required answered`, privacy:"This form sends no data anywhere. You can email us the downloaded file." }
};
// [id, required, TR, EN] — IDs match references/01-discovery-questions.md
const S = [
 ["A","Firma ve iletişim","Company and contact",[
  ["A1",1,"Firmanızın adı ve ne iş yaptığınız","Your company's name and what you do"],
  ["A2",1,"Projede karar verici ve onay veren kişi","Decision maker / who approves"],
  ["A3",1,"Size en hızlı nasıl ve hangi saatlerde ulaşırız?","Fastest way and hours to reach you"],
  ["A4",0,"Rakipleriniz ve sizi onlardan ayıran özellik","Competitors and what sets you apart"]]],
 ["B","Hedefler ve beklentiler","Goals and expectations",[
  ["B1",1,"Bu siteyle ne arıyorsunuz, beklentiniz ne? (satış, randevu, teklif talebi, güven, bilgi)","What are you looking for, what do you expect? (sales, bookings, quote requests, trust, information)"],
  ["B2",1,"6 ay sonra \"site işe yaradı\" demek için ne olmalı?","In six months, what has to be true to say the site worked?"],
  ["B3",1,"Mevcut siteniz (adres) ve nesini sevip sevmediğiniz","Your current site (address), what you like and dislike"],
  ["B4",0,"Bu proje neden şimdi?","Why now?"]]],
 ["C","Hedef kitle","Audience",[
  ["C1",1,"İdeal müşteriniz kim? (yaş, şehir/ülke, meslek, B2B/B2C)","Your ideal customer (age, city/country, job, B2B/B2C)"],
  ["C2",1,"Site hangi dillerde olacak?","Which languages?"],
  ["C3",0,"Müşterileriniz sizi bulmak için Google'a ne yazıyor?","What do customers type into Google to find you?"],
  ["C4",0,"Ziyaretçiler çoğunlukla mobil mi masaüstü mü?","Mostly mobile or desktop visitors?"]]],
 ["D","Sayfalar ve içerik","Pages and content",[
  ["D1",1,"İstediğiniz sayfalar","Pages you want"],
  ["D2",1,"Metinleri kim yazacak? Fotoğraf/video var mı, çekim gerekir mi?","Who writes the copy? Do you have photos/video, or is a shoot needed?"],
  ["D3",1,"Siteyi yayından sonra kendiniz güncellemek ister misiniz?","Do you want to update the site yourselves after launch?"],
  ["D4",0,"Eski siteden taşınacak içerik (yaklaşık sayı)","Content to move from the old site (rough count)"]]],
 ["E","Tasarım","Design",[
  ["E1",1,"Tercih ettiğiniz renkler / kurumsal renkler (HEX) / istemediğiniz renk","Preferred colors / brand colors (HEX) / colors to avoid"],
  ["E2",1,"Logo (vektör), kurumsal kimlik kılavuzu, fontlar","Logo (vector), brand guide, fonts"],
  ["E3",1,"Beğendiğiniz 2–3 site ve nedeni; beğenmediğiniz site","2–3 sites you like and why; a site you dislike"],
  ["E4",1,"Site nasıl hissettirmeli? 3 kelime","How should the site feel? 3 words"]]],
 ["F","Özellikler","Features",[
  ["F1",1,"Gerekli özellikler (form, randevu, online satış, üyelik, arama, WhatsApp, harita, bülten…)","Features needed (form, booking, online sales, login, search, WhatsApp, map, newsletter…)"],
  ["F2",1,"Bağlanacak sistemler (CRM, ERP, muhasebe, e-posta pazarlama…) — yoksa \"yok\"","Systems to connect (CRM, ERP, accounting, email marketing…) — or \"none\""],
  ["F3",0,"E-ticaret varsa: ürün sayısı, kargo, ödeme sağlayıcı","If e-commerce: product count, shipping, payment provider"]]],
 ["G","SEO ve pazarlama","SEO and marketing",[
  ["G1",1,"Google'da hangi aramalarda çıkmak istiyorsunuz? Yerel/ulusal/uluslararası?","Which searches do you want to rank for? Local/national/international?"],
  ["G2",1,"Google Business Profile, Search Console, Analytics hesaplarınız ve erişim","Google Business Profile, Search Console, Analytics accounts and access"],
  ["G3",0,"Reklam planı ve aylık bütçe","Ad plans and monthly budget"],
  ["G4",0,"Düzenli blog/içerik ister misiniz? Ayda kaç yazı?","Regular blog/content? Posts per month?"]]],
 ["H","Teknik","Technical",[
  ["H1",1,"Alan adınız var mı, nerede kayıtlı, erişiminiz var mı?","Domain: do you own one, where is it registered, do you have access?"],
  ["H2",1,"Hosting ve kurumsal e-posta nerede?","Where are hosting and business email?"],
  ["H3",0,"Teknik tercih/kısıt","Technical preferences or constraints"]]],
 ["I","Yasal","Legal",[
  ["I1",1,"KVKK/GDPR, çerez politikası, satış sözleşmeleri hazır mı? Kim hazırlayacak?","Privacy (KVKK/GDPR), cookie policy, sales terms ready? Who writes them?"],
  ["I2",0,"Sektörünüzde içerik/reklam kısıtı","Sector restrictions on content/ads"]]],
 ["J","Bütçe ve zaman","Budget and timeline",[
  ["J1",1,"Bu proje için ayırdığınız bütçe aralığı","Budget range for this project"],
  ["J2",1,"Site ne zaman yayında olmalı? Sabit bir tarih var mı?","When must the site be live? Any fixed date?"],
  ["J3",1,"Yayından sonra aylık bakım/destek/SEO ister misiniz?","Monthly maintenance/support/SEO after launch?"]]],
 ["K","Proje aşamaları","Project stages",[
  ["K1",1,"Projenin aşamaları sizce nasıl olmalı, nerelerde onay vermek istersiniz?","How should the stages work, where do you want to approve?"],
  ["K2",1,"Kaç revizyon turu bekliyorsunuz?","How many revision rounds do you expect?"],
  ["K3",0,"Ne sıklıkla durum raporu istersiniz?","How often do you want status updates?"],
  ["K4",0,"Daha önce ajansla çalıştınız mı, neyi iyi/kötü buldunuz?","Worked with an agency before? What went well or badly?"]]]
];
const KEY = "e2e-questionnaire:" + location.pathname;
let lang = "tr";
const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
const form = document.getElementById("form");
const all = S.flatMap(s => s[3]);

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  for (const id of ["title","intro","privacy"]) document.getElementById(id).textContent = t[id];
  document.getElementById("download").textContent = document.getElementById("download2").textContent = t.dl;
  document.getElementById("lang").textContent = t.other;
  form.innerHTML = "";
  for (const [sid, tr, en, qs] of S) {
    const sec = document.createElement("section");
    const h = document.createElement("h2"); h.textContent = `${sid}. ${lang === "tr" ? tr : en}`; sec.append(h);
    for (const [id, req, qtr, qen] of qs) {
      const l = document.createElement("label"); l.htmlFor = id; l.textContent = `${id}. ${lang === "tr" ? qtr : qen}`;
      if (req) { const s = document.createElement("span"); s.className = "req"; s.textContent = "*"; s.setAttribute("aria-label", lang === "tr" ? "gerekli" : "required"); l.append(s); }
      const ta = document.createElement("textarea"); ta.id = id; ta.value = saved[id] || ""; if (req) ta.required = true;
      ta.addEventListener("input", () => { saved[id] = ta.value; localStorage.setItem(KEY, JSON.stringify(saved)); ta.classList.remove("missing"); progress(); });
      sec.append(l, ta);
    }
    form.append(sec);
  }
  progress();
}
function progress() {
  const req = all.filter(q => q[1]);
  const done = req.filter(q => (saved[q[0]] || "").trim()).length;
  document.getElementById("progress").textContent = T[lang].progress(done, req.length);
}
function download() {
  const missing = all.filter(q => q[1] && !(saved[q[0]] || "").trim()).map(q => q[0]);
  const msg = document.getElementById("msg");
  if (missing.length) {
    msg.textContent = `${T[lang].missing} ${missing.join(", ")}`;
    missing.forEach(id => document.getElementById(id).classList.add("missing"));
    document.getElementById(missing[0]).focus();
    return;
  }
  msg.textContent = "";
  const lines = [`# Questionnaire answers — ${document.getElementById("agency").textContent}`, `Date: ${new Date().toISOString().slice(0,10)} · Language: ${lang}`, ""];
  for (const [sid, tr, en, qs] of S) {
    lines.push(`## ${sid}. ${tr} / ${en}`);
    for (const [id, , qtr, qen] of qs) lines.push(`- **${id}** (${lang === "tr" ? qtr : qen}): ${(saved[id] || "").trim().replace(/\n+/g, " ") || "—"}`);
    lines.push("");
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/markdown" }));
  const name = (saved.A1 || "client").split(/[\n,.]/)[0].trim().toLowerCase().replace(/[^a-z0-9ğüşöçı]+/gi, "-").slice(0, 40) || "client";
  a.download = `questionnaire-${name}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
}
document.getElementById("lang").onclick = () => { lang = lang === "tr" ? "en" : "tr"; render(); };
document.getElementById("download").onclick = document.getElementById("download2").onclick = download;
render();
</script>
</body>
</html>
